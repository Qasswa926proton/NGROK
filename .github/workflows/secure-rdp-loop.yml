name: Secure RDP via Ngrok (Automated Loop)

on:
  workflow_dispatch:
    inputs:
      gh_api_token:
        description: "🔒 ToolboxLap | ENTER YOUR GITHUB PAT HERE (Starts with ghp_...)"
        required: true
        default: ""
      loops:
        description: "🔄 System Internal Counter (Leave Empty - Managed Automatically)"
        required: false
        default: ""

concurrency:
  group: rdp-loop-singleton
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - name: 🔒 Executing Secured Core Engine
        run: |
          $token = "${{ github.event.inputs.gh_api_token }}"
          if (-not $token -or -not ($token -match '^ghp_[a-zA-Z0-9]+$')) {
              Write-Error "❌ Invalid Token!"
              exit 1
          }

          # 📢 Protected Branding & Dynamic Injector (Updated with YOUR credentials)
          $u_enc = "SEFNN09mZmljZQ==" # مشفر: HAM7Office
          $p_enc = "TXlTdHJvbmcxMjM=" # مشفر: MyStrong123
          $w_enc = "aHR0cHM6Ly93d3cudG9vbGJveGxhcC5jb20="
          $y_enc = "aHR0cHM6Ly93d3cueW91dHViZS5jb20vQFRPT0xCT1hMQVAtdTFj"
          
          $u = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($u_enc))
          $p = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($p_enc))
          $w = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($w_enc))
          $y = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($y_enc))

          if ($w -notlike "*toolboxlap*") {
              Write-Error "🔒 Security Violation: Unauthorized modification detected!"
              exit 1
          }

          $summaryContent = @"
          # 🚀 TOOLBOXLAP OFFICIAL RDP AUTOMATION (NGROK)
          ### 🔒 Copyright & Ownership
          * **Copyright © 2026 ToolboxLap.com**
          * All rights reserved. Do not remove or modify copyright text.
          ### 🔗 Official Channels & Support
          * 🌐 **Official Website:** [$w]($w/)
          * 📺 **YouTube Channel:** [Subscribe Here]($y)
          ---
          "@
          $summaryContent | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          # ⚙️ Core RDP Configuration (تم إصلاح NLA للسماح بتسجيل الدخول المباشر)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1 -Force
          
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null
          New-NetFirewallRule -DisplayName "Allow RDP via Ngrok" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 | Out-Null
          Restart-Service -Name TermService -Force

          # 👤 Create RDP User (استخدام الطريقة الأكثر استقراراً)
          net user $u $p /add /Y | Out-Null
          net localgroup administrators $u /add | Out-Null

          # 📥 Download, Extract, and Fix Permissions (LibreWolf)
          $DirectLink = "https://github.com/Wosol33/Tailscale/releases/download/LWR152/librewolf_RDP.rar"
          $DesktopPath = "C:\Users\Public\Desktop"
          $Destination = "$DesktopPath\librewolf_RDP.rar"
          
          Write-Host "Downloading librewolf_RDP.rar..."
          Invoke-WebRequest -Uri $DirectLink -OutFile $Destination
          Write-Host "تم التحميل! جاري فك الضغط..."
          
          tar -xf $Destination -C $DesktopPath
          Remove-Item $Destination -Force
          
          Write-Host "جاري تعديل الصلاحيات..."
          Get-ChildItem -Path "$DesktopPath" -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object {
              if ($_.IsReadOnly) { $_.IsReadOnly = $false }
          }
          icacls "$DesktopPath\*" /grant "${u}:(OI)(CI)F" /T /C /Q | Out-Null
          Write-Host "تم تجهيز الصلاحيات بنجاح!"

          # 🌐 Silent Ngrok Engine Setup
          Write-Host "Downloading Ngrok..."
          Invoke-WebRequest "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-stable-windows-amd64.zip" -OutFile "$env:TEMP\ngrok.zip"
          Expand-Archive "$env:TEMP\ngrok.zip" -DestinationPath "$env:TEMP" -Force
          
          Write-Host "Authenticating Ngrok..."
          & "$env:TEMP\ngrok.exe" authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          
          Write-Host "Starting Ngrok Tunnel..."
          Start-Process -FilePath "$env:TEMP\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -NoNewWindow -RedirectStandardOutput "$env:TEMP\ngrok.log"
          
          $timeout = 60
          $tunnelUrl = $null
          
          while ($timeout -gt 0 -and -not $tunnelUrl) {
            Start-Sleep -Seconds 5
            $timeout -= 5
            try {
              $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
              $tunnelUrl = $response.tunnels[0].public_url -replace "tcp://", ""
            } catch {
              $logContent = Get-Content "$env:TEMP\ngrok.log" -ErrorAction SilentlyContinue
              $tunnelUrl = $logContent | Select-String -Pattern "tcp://([a-zA-Z0-9\.\-]+:\d+)" | ForEach-Object { $_.Matches.Groups[1].Value }
            }
          }

          if (-not $tunnelUrl) {
            Write-Error "Ngrok Network Fail - Could not establish tunnel."
            exit 1
          }

          # 📢 Printing Credentials
          Write-Host "Address: $tunnelUrl"
          Write-Host "Username: $u"
          Write-Host "Password: $p"
          Write-Host "-----------------------------------------------------------------"
          Write-Host "⚡ Powered by Toolbox Lab"
          Write-Host "================================================================="

          # ⏱️ Protected Runtime Production Loop
          $m = 340
          for ($i = 1; $i -le $m; $i++) {
              Start-Sleep -Seconds 60
          }

          # 🔁 Secured Chain Rotation Engine
          $inputLoops = "${{ github.event.inputs.loops }}"
          $loops = if (-not $inputLoops) { 4 } else { [int]$inputLoops }
          if ($loops -eq 1) { Write-Host "🎯 Chain Finished Successfully."; exit 0 }
          
          $next = $loops - 1
          $body = @{
            ref    = "${{ github.ref_name }}"
            inputs = @{ gh_api_token = "$token"; loops = "$next" }
          } | ConvertTo-Json -Depth 5

          # تأكد من أن اسم السكربت يتطابق مع الاسم الموجود في مستودعك
          Invoke-RestMethod -Method POST `
            -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/secure-rdp-loop.yml/dispatches" `
            -Headers @{ Authorization = "Bearer $token"; "Accept"="application/vnd.github+json" } `
            -Body $body
